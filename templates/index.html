
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CART3R OSINT</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #080808;
      color: #eee;
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    .container { max-width: 700px; margin: 40px auto; }
    header { text-align: center; margin-bottom: 35px; }
    h1 { color: #ed2020; letter-spacing: 4px; }
    .subtitle { color: #888; }
    .panel {
      background: #141414;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 22px;
      margin-bottom: 18px;
    }
    h2 { color: #ed2020; font-size: 18px; }
    input {
      width: 100%;
      padding: 14px;
      background: #080808;
      color: white;
      border: 1px solid #444;
      border-radius: 7px;
      margin: 10px 0;
      font-size: 16px;
    }
    button {
      width: 100%;
      padding: 13px;
      background: #c91616;
      color: white;
      border: 0;
      border-radius: 7px;
      font-weight: bold;
      font-size: 15px;
      margin-top: 8px;
    }
    button:active { background: #8f1010; }
    pre {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      color: #ddd;
      background: #080808;
      border: 1px solid #333;
      padding: 14px;
      border-radius: 8px;
    }
    .error { color: #ff5555; }
    footer { color: #666; text-align: center; font-size: 12px; }
  </style>
</head>
<body>
<div class="container">
  <header>
    <h1>CART3R OSINT</h1>
    <p class="subtitle">OSINT SEARCHER — ÉDITION WEB</p>
  </header>

  <section class="panel">
    <h2>01 — AUDIT DE DOMAINE</h2>
    <input id="domain" placeholder="exemple.fr">
    <button onclick="runAudit('domain')">LANCER L'AUDIT</button>
  </section>

  <section class="panel">
    <h2>02 — MON E-MAIL</h2>
    <input id="email" type="email" placeholder="mon@email.fr">
    <button onclick="runAudit('email')">VÉRIFIER</button>
  </section>

  <section class="panel">
    <h2>03 — MON PSEUDO</h2>
    <input id="username" placeholder="MonPseudo">
    <button onclick="runAudit('username')">RECHERCHER</button>
  </section>

  <section class="panel">
    <h2>04 — RAPPORT</h2>
    <pre id="result">En attente d'une recherche...</pre>
    <button onclick="copyReport()">COPIER LE RAPPORT</button>
  </section>

  <footer>
    CART3R OSINT — Contrôles publics non intrusifs.
  </footer>
</div>

<script>
let lastReport = null;

async function runAudit(kind) {
  const input = document.getElementById(kind);
  const result = document.getElementById("result");
  const value = input.value.trim();

  if (!value) {
    result.textContent = "Veuillez saisir une valeur.";
    return;
  }

  result.textContent = "Analyse en cours...";

  try {
    const response = await fetch("/api/audit", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ kind, value })
    });

    const data = await response.json();
    lastReport = data;
    result.textContent = JSON.stringify(data, null, 2);
  } catch (error) {
    result.textContent = "Erreur de connexion au serveur.";
  }
}

async function copyReport() {
  if (!lastReport) return;
  try {
    await navigator.clipboard.writeText(
      JSON.stringify(lastReport, null, 2)
    );
    alert("Rapport copié !");
  } catch (error) {
    alert("Impossible de copier le rapport.");
  }
}
</script>
</body>
</html>
